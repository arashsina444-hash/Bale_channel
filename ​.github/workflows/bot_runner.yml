name: News Bot Scheduler

on:
  workflow_dispatch: # اجازه می‌دهد از طریق cron-job.org یا دستی آن را اجرا کنیم
  schedule:
    - cron: '*/30 * * * *' # اجرای داخلی گیت‌هاب (به عنوان بک‌آپ سیستم)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # دادن دسترسی نوشتن برای کامیت کردن فایل
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py

      - name: Commit and push state file
        run: |
          # تنظیمات هویت ربات گیت‌هاب برای کامیت
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # اضافه کردن فایل وضعیت به استیج
          git add daily_state.json
          
          # کامیت کردن تغییرات (اگر فایلی تغییر نکرده باشد ارور نمی‌دهد)
          # عبارت [skip ci] باعث می‌شود این کامیت، مجدداً یک اکشن جدید را استارت نزند
          git commit -m "🤖 Update daily state quotas [skip ci]" || echo "No changes to commit"
          
          # پوش کردن تغییرات به مخزن
          git push
